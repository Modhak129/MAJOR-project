fl:
  strategy: fedavg
  num_rounds: 5
  num_clients: 2
  local_epochs: 3
  learning_rate: 0.001
  batch_size: 16
  fedprox_mu: 0.01

adaptive:
  vram_threshold_mb: 8192 # Changed from 4096 to ensure nodes use the 100-epoch pretrained nano model
  sparsification_k: 0.01
  performance_threshold_fps: 15.01
  kd_temperature: 4.0

data:
  dirichlet_alpha: 0.5
  random_seed: 42
  train_split: 0.8

inference:
  input_resolution: 320
  min_confidence: 0.45
  alert_cooldown_sec: 10
  quantization: "int8"

models:
  nano: "models/yolov8n.pt"
  small: "models/yolov8s.pt"

server:
  grpc_port: 8080
  dashboard_port: 5000
  checkpoint_dir: "experiments/checkpoints"
