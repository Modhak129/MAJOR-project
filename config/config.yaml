fl:
  strategy: fedavg
  num_rounds: 5
  num_clients: 2
  local_epochs: 3
  learning_rate: 0.001
  batch_size: 16
  fedprox_mu: 0.01

adaptive:
  vram_threshold_mb: 8192
  sparsification_k: 0.01
  performance_threshold_fps: 15.01
  kd_temperature: 4.0

data:
  dirichlet_alpha: 0.5
  random_seed: 42
  train_split: 0.8

inference:
  ppe_detector_mode: "two_stage"
  helmet_model_path: "edge/weights/hardhat_helmet_yolov8n_640_best.pt"
  vest_model_path: "edge/weights/stage2_vest_yolov8n_640_best.pt"
  helmet_conf: 0.40
  helmet_crop_expansion: 0.20
  vest_crop_expansion: 0.20
  input_resolution: 320
  min_confidence: 0.45
  vest_confidence: 0.35
  alert_cooldown_sec: 10
  quantization: "int8"

models:
  nano: "edge/weights/clean_sh17_yolov8n_640_best.pt"
  small: "edge/weights/sh17_yolov8s_fine_best.pt"
  focused_small: "edge/weights/sh17_focused_yolov8s_640_best.pt"
  focused_nano: "edge/weights/sh17_focused_yolov8n_640_best.pt"

server:
  grpc_port: 8080
  dashboard_port: 5000
  checkpoint_dir: "experiments/checkpoints"
